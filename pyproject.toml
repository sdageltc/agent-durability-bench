[project]
name = "agent-durability-bench"
version = "0.1.0"
description = "Crash-resilience and durability benchmark for autonomous AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "psutil>=5.9.8",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
