[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-durability-bench"
version = "0.1.0"
description = "Crash-resilience, token waste, and recovery benchmark for autonomous AI coding agents (DCP-1.0)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "sdageltc", email = "sdageltc@users.noreply.github.com" }
]
keywords = [
    "autonomous-agents",
    "agent-durability",
    "crash-resilience",
    "wal",
    "token-waste",
    "swe-bench",
    "gaia",
    "agentbench",
    "process-isolation",
    "sigkill",
    "dcp-1.0",
    "ai-agents",
    "benchmarks"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "psutil>=5.9.8",
    "tabulate>=0.9.0"
]

[project.urls]
Homepage = "https://sdageltc.github.io/agent-durability-bench/"
Documentation = "https://github.com/sdageltc/agent-durability-bench#readme"
Repository = "https://github.com/sdageltc/agent-durability-bench"
"Bug Tracker" = "https://github.com/sdageltc/agent-durability-bench/issues"

[project.scripts]
durability-bench = "harness.runner:main"

[tool.setuptools.packages.find]
include = ["harness*", "adapters*"]
exclude = ["tests*", "results*", ".bench_wal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
